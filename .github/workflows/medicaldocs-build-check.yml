name: MedicalDocs build check

on:
  push:
    branches:
      - fix/medicaldocs-tablet-pen-build
  pull_request:
    branches:
      - feat/pdf-visual-thumbnails

permissions:
  contents: read

concurrency:
  group: medicaldocs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: TypeScript and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run production build
        run: npm run build
